<svg xmlns="http://www.w3.org/2000/svg" width="920" height="145" viewBox="0 0 920 145" role="img" aria-labelledby="title desc">
  <title id="title">NetSpeed Widget in the Windows taskbar</title>
  <desc id="desc">The taskbar display shows download and upload speeds, a rolling traffic graph, 9 millisecond latency, and vertical gauges for CPU, RAM, disk activity and storage space between pinned apps and the system tray.</desc>
  <defs>
    <linearGradient id="desktop" x2="0" y2="1"><stop stop-color="#243047"/><stop offset="1" stop-color="#392b3b"/></linearGradient>
    <linearGradient id="taskbar" x2="0" y2="1"><stop stop-color="#432735"/><stop offset="1" stop-color="#251e2d"/></linearGradient>
  </defs>
  <rect width="920" height="145" fill="url(#desktop)"/>
  <path d="M0 95h920v50H0z" fill="url(#taskbar)"/>
  <path d="M0 95h920" stroke="#a48b98" stroke-opacity=".22"/>
  <g transform="translate(96 106)">
    <rect width="27" height="27" rx="7" fill="#1384d6"/><path d="M6 6h6v6H6zm9 0h6v6h-6zm-9 9h6v6H6zm9 0h6v6h-6z" fill="#fff"/>
    <rect x="41" width="27" height="27" rx="7" fill="#f3f4f6"/><circle cx="54.5" cy="13.5" r="8" fill="#e84b3c"/><path d="M49 15h11" stroke="#f6cd42" stroke-width="3"/>
    <rect x="82" width="27" height="27" rx="5" fill="#252c39"/><path d="m89 8 6 5.5-6 5.5m8 0h7" fill="none" stroke="#ccc" stroke-width="2"/>
    <rect x="123" width="27" height="27" rx="5" fill="#ecc02f"/><path d="M129 8h15v12h-15z" fill="#fff1a4"/>
    <path d="M164 6h25v16h-25z" fill="#147eb3"/><path d="m170 10-4 4 4 4m6-8 4 4-4 4" fill="none" stroke="#d5ecff" stroke-width="1.5"/>
    <rect x="205" width="27" height="27" rx="6" fill="#283449"/><circle cx="218.5" cy="13.5" r="8" fill="#eceff3"/><path d="M218.5 7v7l5 3" fill="none" stroke="#2c3c54" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-weight="600">
    <text x="356" y="117" fill="#54d8ef" font-size="12">↓</text>
    <text x="395" y="117" text-anchor="end" fill="#f5f6f8" font-size="12">211</text>
    <text x="400" y="117" fill="#d6dbe2" font-size="8">kB/s</text>
    <text x="356" y="134" fill="#b99cff" font-size="12">↑</text>
    <text x="395" y="134" text-anchor="end" fill="#f5f6f8" font-size="12">91.0</text>
    <text x="400" y="134" fill="#d6dbe2" font-size="8">kB/s</text>
  </g>
  <path d="M432 132h42" stroke="#b6c1ce" stroke-opacity=".2"/>
  <path d="M432 130 438 126 442 129 447 120 452 124 457 116 462 123 468 114 474 118" fill="none" stroke="#58d6e9" stroke-width="1.5"/>
  <circle cx="490" cy="120" r="2.2" fill="#55d895"/>
  <text x="498" y="124" fill="#e5ebf0" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">9 ms</text>
  <rect x="531" y="105" width="1" height="30" fill="#d6dbe2" fill-opacity=".22"/>
  <g font-family="Segoe UI, sans-serif">
    <rect x="541" y="103" width="4.5" height="34" rx="2" fill="#d6dbe2" fill-opacity=".22"/>
    <rect x="541" y="129" width="4.5" height="8" rx="2" fill="#54d8ef"/>
    <text x="564" y="117" text-anchor="end" fill="#f5f6f8" font-size="11" font-weight="600">24</text>
    <text x="565" y="117" fill="#d6dbe2" font-size="8">%</text>
    <text x="550" y="134" fill="#d6dbe2" font-size="8.5">CPU</text>

    <rect x="579" y="103" width="4.5" height="34" rx="2" fill="#d6dbe2" fill-opacity=".22"/>
    <rect x="579" y="116" width="4.5" height="21" rx="2" fill="#b99cff"/>
    <text x="602" y="117" text-anchor="end" fill="#f5f6f8" font-size="11" font-weight="600">62</text>
    <text x="603" y="117" fill="#d6dbe2" font-size="8">%</text>
    <text x="588" y="134" fill="#d6dbe2" font-size="8.5">RAM</text>

    <rect x="617" y="103" width="4.5" height="34" rx="2" fill="#d6dbe2" fill-opacity=".22"/>
    <rect x="617" y="132" width="4.5" height="5" rx="2" fill="#55d895"/>
    <text x="640" y="117" text-anchor="end" fill="#f5f6f8" font-size="11" font-weight="600">14</text>
    <text x="641" y="117" fill="#d6dbe2" font-size="8">%</text>
    <text x="626" y="134" fill="#d6dbe2" font-size="8.5">DSK</text>

    <rect x="655" y="103" width="4.5" height="34" rx="2" fill="#d6dbe2" fill-opacity=".22"/>
    <rect x="655" y="117" width="4.5" height="20" rx="2" fill="#a9b4c0"/>
    <text x="678" y="117" text-anchor="end" fill="#f5f6f8" font-size="11" font-weight="600">58</text>
    <text x="679" y="117" fill="#d6dbe2" font-size="8">%</text>
    <text x="664" y="134" fill="#d6dbe2" font-size="8.5">SSD</text>
  </g>
  <!-- Notification icons share a centerline; the clock has its own column. -->
  <g fill="none" stroke="#e5ebf0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m699 122 4-4 4 4"/>
    <path d="M724 114v12m-4-9 8 6-4 3v-12l4 3-8 6"/>
    <path d="M742 117q7-6 14 0m-11 3q4-4 8 0m-5 3h2"/>
    <path d="M769 118h3l4-4v12l-4-4h-3zm10 0 4 4m0-4-4 4"/>
    <rect x="797" y="115" width="18" height="10" rx="2"/>
    <path d="M818 118v4"/>
  </g>
  <rect x="800" y="118" width="12" height="4" rx=".5" fill="#e5ebf0"/>
  <g fill="#e5ebf0" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="end">
    <text x="901" y="117">05:11 AM</text>
    <text x="901" y="132">10/20/2026</text>
  </g>
</svg>

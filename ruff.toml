# Ruff configuration for NetSpeed Widget.
# Shared by local runs, lint.ps1 and the GitHub Actions lint workflow.

# Match the Python version releases are built with (release.yml uses 3.11).
target-version = "py311"

# 88 characters matches the project convention (see ~/.agents/conventions/python.md).
line-length = 88

# select is intentionally left unset so the project tracks Ruff's documented
# default rule set (413 rules since v0.16). Add per-file-ignores only with a
# comment that names the reason.

[lint.per-file-ignores]
# Every entry below is a deliberate defensive boundary that logs or records the
# error and must never crash the widget, so narrowing to specific exception
# types is either unsafe or would require catching dozens of third-party types.
# GUI monitor enumeration and the speedtest background thread: any failure logs
# and falls back rather than taking down the Tk app.
"app.py" = ["BLE001"]
# Win32 window setup records its init error for later, and the hotkey callback
# is isolated so a user-callback bug cannot kill the message pump.
"utils/hotkeys.py" = ["BLE001"]
# Logging is a best-effort contract: a failed write must never propagate.
"utils/logger.py" = ["BLE001"]
# The provider loop logs each backend failure and falls through to the next;
# speedtest-cli and psutil can raise many unrelated exception types.
"utils/speedtest.py" = ["BLE001"]

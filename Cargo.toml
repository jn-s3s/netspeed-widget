[package]
name = "netspeed-widget"
version = "2.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A tiny Windows taskbar widget that shows live network speed, latency and traffic history"
repository = "https://github.com/jn-s3s/netspeed-widget"
readme = "README.md"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[package.metadata.winres]
CompanyName = "jn-s3s"
ProductName = "NetSpeed Widget"
FileDescription = "Network speed widget for the Windows taskbar"
OriginalFilename = "netspeed-widget.exe"
InternalName = "NetSpeedWidget"
LegalCopyright = "Copyright (C) 2026 jn-s3s"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

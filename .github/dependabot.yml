version: 2
updates:
    # Native Rust application dependencies
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "weekly"
      target-branch: "dev"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
          - "rust"
      commit-message:
          prefix: "deps"

    # GitHub Actions workflows
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      target-branch: "dev"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "github-actions"
      commit-message:
          prefix: "ci"

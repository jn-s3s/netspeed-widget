name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build and publish
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.11"

            - name: Lint, format and test
              run: |
                  python -m pip install -r requirements.txt -r requirements-dev.txt
                  ruff check .
                  ruff format --check .
                  python -m pytest tests -q

            - name: Restore build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              id: build-cache
              with:
                  path: dist
                  key: build-dist-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('*.py', 'utils/**/*.py', 'tray/**/*.py', 'icon.ico', 'requirements.txt', 'third_party/fast-bundle/package.json', 'third_party/fast-bundle/package-lock.json') }}
                  restore-keys: |
                      build-dist-${{ runner.os }}-

            - name: Install/Update pip
              if: steps.build-cache.outputs.cache-hit != 'true'
              run: |
                  python -m pip install --upgrade pip

            - name: Run Build Script
              if: steps.build-cache.outputs.cache-hit != 'true'
              run: python build.py
              env:
                  APP_VERSION: ${{ github.ref_name }}

            - name: Check build output
              run: dir dist

            - name: Package Windows x64 release
              id: archive
              shell: pwsh
              run: |
                  # The package is named after the directory build.py produced.
                  # Re-deriving it from the tag here would put a second copy of
                  # that name in the release path, where the two can drift.
                  $packages = @(Get-ChildItem -LiteralPath "dist" -Directory)
                  if ($packages.Count -ne 1) {
                      throw "Expected exactly one package directory in dist, found $($packages.Count)"
                  }
                  $package = $packages[0]
                  $executable = Join-Path $package.FullName "$($package.Name).exe"
                  if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
                      throw "Release executable not found: $executable"
                  }

                  $archiveName = "$($package.Name)-windows-x64.zip"
                  $archive = Join-Path "dist" $archiveName
                  # Compress-Archive walks the ~10k file tree slower than
                  # ZipFile::CreateFromDirectory, and stays because its output is
                  # what this workflow's packaging has been checked against.
                  Compress-Archive -LiteralPath $package.FullName -DestinationPath $archive -Force

                  # Only the file name crosses into the upload step, which owns
                  # the dist/ prefix, so no separator has to survive the handoff.
                  Add-Content -Path $env:GITHUB_OUTPUT -Value "archive_name=$archiveName"

            - name: Upload GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: NetSpeed Widget ${{ github.ref_name }}
                  files: dist/${{ steps.archive.outputs.archive_name }}
                  draft: true
                  fail_on_unmatched_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

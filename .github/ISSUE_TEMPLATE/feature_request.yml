name: Feature request
description: Suggest an idea for the widget.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Keep in mind the widget is intentionally small and unobtrusive - new features need to earn their place.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's the use case, and why does the current widget fall short?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Wireframes or sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways this could be done, or reasons not to add it.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, references to similar tools, edge cases to think about.
